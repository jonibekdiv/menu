<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Osh Markazi menyusi: plov, shashlik, manti, lag'mon, non va ichimliklar narxlari bilan.">
<meta name="theme-color" content="#F7F1E8">
<title>Osh Markazi menyusi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Archivo:wght@400;500&family=Archivo+Narrow:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
html{scroll-padding-top:0}
.intro{padding:var(--s7) 0 var(--s5);display:grid;gap:var(--s4)}
.intro h1{font-size:var(--t-3xl);max-width:14ch}
.facts{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);color:var(--ink-2);font-size:var(--t-sm)}
.facts a,.facts span{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;text-decoration:none}
.facts a:hover{text-decoration:underline}
.draft-note{padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:var(--t-sm);color:var(--ink-2)}

/* sticky search and categories */
.toolbar{position:sticky;top:64px;z-index:20;margin:0 calc(var(--s4) * -1);padding:var(--s3) var(--s4);
  border-width:0 0 1px;border-color:var(--glass-line);box-shadow:none;display:grid;gap:var(--s3)}
@media (min-width:640px){.toolbar{margin-inline:calc(var(--s5) * -1);padding-inline:var(--s5)}}
@media (min-width:1024px){.toolbar{margin-inline:0;padding:var(--s3);top:72px;border-radius:var(--r-lg);border-width:1px;border-color:var(--glass-edge);grid-template-columns:minmax(220px,320px) minmax(0,1fr);align-items:center}}
.search{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:0 var(--s2) 0 var(--s4);border-radius:var(--r-pill);background:var(--glass-strong);border:1px solid var(--glass-line);color:var(--muted)}
.search:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;min-height:46px;font-size:var(--t-md);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:36px;height:36px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--ink-2)}
.clear:hover{background:var(--paper-3)}
.cats{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px}
.cats::-webkit-scrollbar{display:none}
.cat-link{flex:0 0 auto;display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:var(--r-pill);
  background:var(--glass-strong);border:1px solid var(--glass-line);font:500 var(--t-sm)/1 var(--font-body);text-decoration:none;white-space:nowrap;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.cat-link:hover{border-color:var(--ink)}
.cat-link[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* sections and cards: picture, name, price */
.section{padding-top:var(--s6)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);padding-bottom:var(--s3);margin-bottom:var(--s4);border-bottom:1px solid var(--glass-line)}
.section-head h2{font-size:var(--t-2xl);display:flex;align-items:center;gap:var(--s3)}
.count{color:var(--muted);font:600 var(--t-sm)/1 var(--font-label);white-space:nowrap}
.dishes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
@media (min-width:768px){.dishes{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}}
@media (min-width:1100px){.dishes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dish{display:flex;flex-direction:column;width:100%;height:100%;padding:var(--s2);border-radius:var(--r-lg);text-align:left;
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.dish:hover{transform:translateY(-3px);box-shadow:var(--glass-hi),var(--shadow-lift)}
.dish:active{transform:translateY(0)}
.photo{position:relative;aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;background:var(--paper-3);display:grid;place-items:center;color:var(--ink-2)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .many{position:absolute;right:var(--s2);bottom:var(--s2);display:inline-flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s2);border-radius:var(--r-pill);
  background:var(--glass-strong);font:600 var(--t-xs)/1 var(--font-label);color:var(--ink)}
.dish-name{font:400 var(--t-md)/1.25 var(--font-display);padding:var(--s3) var(--s1) var(--s1)}
.dish-price{margin-top:auto;padding:0 var(--s1) var(--s1);font:600 var(--t-md)/1.3 var(--font-label);color:var(--accent);font-variant-numeric:tabular-nums}
html[data-theme="dark"] .dish-price{color:var(--gold)}
@media (min-width:640px){.dish-name{font-size:var(--t-lg)}}

/* dish detail: carousel, price, ingredients */
.carousel{position:relative;margin:0 0 var(--s4)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-lg);background:var(--paper-3);overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.slide{flex:0 0 100%;margin:0;aspect-ratio:4/3;scroll-snap-align:center;scroll-snap-stop:always}
.slide img{width:100%;height:100%;object-fit:cover}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.nav-btn.prev{left:var(--s2)} .nav-btn.next{right:var(--s2)}
.nav-btn:disabled{opacity:0;pointer-events:none}
.dots{display:flex;justify-content:center;gap:var(--s1);margin-top:var(--s2)}
.dot{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-pill)}
.dot::before{content:"";width:8px;height:8px;border-radius:var(--r-pill);background:var(--rule);transition:background var(--dur) var(--ease),width var(--dur) var(--ease)}
.dot[aria-current="true"]::before{background:var(--ink);width:20px}
.counter{position:absolute;left:var(--s3);top:var(--s3);z-index:2;padding:var(--s1) var(--s2);border-radius:var(--r-pill);background:var(--glass-strong);font:600 var(--t-xs)/1 var(--font-label)}
.detail-price{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--glass-line);margin-bottom:var(--s4)}
.detail-price strong{font:400 var(--t-2xl)/1 var(--font-display);color:var(--accent)}
html[data-theme="dark"] .detail-price strong{color:var(--gold)}
.detail-desc{color:var(--ink-2);margin-bottom:var(--s4)}
.ing-title{font:600 var(--t-sm)/1.3 var(--font-label);color:var(--ink-2);margin:0 0 var(--s2)}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s2)}
.ing li{padding:var(--s2) var(--s3);border-radius:var(--r-pill);background:var(--paper-2);border:1px solid var(--glass-line);font-size:var(--t-sm)}

.foot{margin-top:var(--s8);padding:var(--s6) 0 calc(var(--s6) + env(safe-area-inset-bottom));border-width:1px 0 0;border-color:var(--glass-line);box-shadow:none}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s4)}
.foot strong{font:400 var(--t-xl)/1.1 var(--font-display)}
.foot small{color:var(--muted);font-size:var(--t-xs)}
</style>
</head>
<body>

<header class="top glass">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Menyu boshiga">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-name" id="brandName">Osh Markazi</span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Qorong'i rejim"></button>
    </div>
  </div>
</header>

<main class="wrap" id="top">
  <section class="intro" aria-labelledby="menuTitle">
    <h1 id="menuTitle">Menyu</h1>
    <div class="facts" id="facts"></div>
    <p class="draft-note glass" id="draftNote" hidden>Bu admin qoralamasi, faqat shu brauzerda ko'rinadi. Mijozlar <code>menu.json</code> dagi menyuni ko'radi.</p>
  </section>

  <div class="toolbar glass" id="toolbar">
    <div class="search" role="search">
      <span id="searchIco" aria-hidden="true"></span>
      <label class="vh" for="q">Taom qidirish</label>
      <input id="q" type="search" placeholder="Taom yoki mahsulot: manti, sabzi" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clearQ" type="button" aria-label="Qidiruvni tozalash" hidden></button>
    </div>
    <nav class="cats" id="catNav" aria-label="Kategoriyalar"></nav>
  </div>
  <p class="vh" id="searchStatus" aria-live="polite"></p>

  <div id="menu"></div>
</main>

<footer class="foot glass">
  <div class="wrap" id="foot"></div>
</footer>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="common.js"></script>
<script>
let MENU = null;
let query = '';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrollBehavior = () => (reduceMotion ? 'auto' : 'smooth');

async function boot() {
  initTheme();
  initSheet();
  $('#brandMark').innerHTML = svg('bowl', 22);
  $('#searchIco').innerHTML = svg('search', 18);
  $('#clearQ').innerHTML = svg('x', 16);

  const wantDraft = new URLSearchParams(location.search).has('draft');
  const draft = loadDraft();
  const published = wantDraft ? null : await loadPublished();
  MENU = (wantDraft && draft) || published || draft || defaultMenu();
  $('#draftNote').hidden = !(wantDraft && MENU === draft);

  renderHeader();
  renderSections();

  let typing = 0;
  $('#q').addEventListener('input', e => {
    query = norm(e.target.value);
    $('#clearQ').hidden = !e.target.value;
    renderSections();
    revealResults();
    clearTimeout(typing);
    typing = setTimeout(announce, 500);
  });
  $('#clearQ').addEventListener('click', () => {
    const q = $('#q');
    q.value = ''; query = ''; $('#clearQ').hidden = true;
    renderSections(); announce(); q.focus();
  });
  $('#catNav').addEventListener('click', onCatClick);
  $('#menu').addEventListener('click', e => {
    const b = e.target.closest('[data-dish]');
    if (b) openDish(b.dataset.dish);
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  window.addEventListener('storage', e => {
    if (wantDraft && e.key === STORE_KEY) { const d = loadDraft(); if (d) { MENU = d; renderHeader(); renderSections(); } }
  });
}

/* ---------- header and footer ---------- */
function renderHeader() {
  const st = MENU.settings;
  document.title = `${st.name} menyusi`;
  $('#brandName').textContent = st.name;
  $('#menuTitle').textContent = `${st.name} menyusi`;
  const tel = telHref(st.phone), tg = telegramHref(st.telegram);
  const contact = (tel ? `<a href="${esc(tel)}">${svg('phone', 18)}${esc(st.phone)}</a>` : '') +
    (tg ? `<a href="${esc(tg)}" target="_blank" rel="noopener noreferrer">${svg('telegram', 18)}Telegram</a>` : '');
  $('#facts').innerHTML =
    (st.hours ? `<span>${svg('clock', 18)}${esc(st.hours)}</span>` : '') +
    (st.address ? `<span>${svg('location', 18)}${esc(st.address)}</span>` : '') + contact;
  $('#foot').innerHTML = `
    <div><strong>${esc(st.name)}</strong><br><small>${esc(st.hours || '')}</small></div>
    <div class="facts">${contact}</div>
    <small>Narxlar ${esc(st.currency)}da.</small>`;
}

/* ---------- search ---------- */
function matches(d, catLabel) {
  if (!query) return true;
  return [d.name, d.desc, d.ing, catLabel].some(t => norm(t).includes(query));
}
function groups() {
  return MENU.cats
    .map(c => ({ c, list: MENU.dishes.filter(d => d.available && d.cat === c.id && matches(d, c.name)) }))
    .filter(g => g.list.length);
}
function announce() {
  const n = $$('.dish').length;
  $('#searchStatus').textContent = query ? (n ? `${n} ta taom topildi` : 'Hech narsa topilmadi') : '';
}
/* When the search bar is stuck at the top, bring the first result up to it. */
function revealResults() {
  const y = $('#menu').getBoundingClientRect().top + scrollY - stickyBottom() - 8;
  if (scrollY > y) window.scrollTo({ top: Math.max(0, y), behavior: 'auto' });
}

/* ---------- sections ---------- */
function renderSections() {
  const cur = MENU.settings.currency;
  const gs = groups();

  $('#catNav').innerHTML = gs.map(({ c }) =>
    `<a class="cat-link" href="#cat-${esc(c.id)}" data-cat="${esc(c.id)}" aria-current="false">${svg(c.icon, 16)}${esc(c.name)}</a>`).join('');

  if (!gs.length) {
    $('#menu').innerHTML = `<div class="empty"><h3>Hech narsa topilmadi</h3><p>Boshqa so'z bilan qidiring yoki qidiruvni tozalang.</p></div>`;
    return;
  }
  $('#menu').innerHTML = gs.map(({ c, list }) => `
    <section class="section" id="cat-${esc(c.id)}" data-cat="${esc(c.id)}" aria-labelledby="h-${esc(c.id)}">
      <div class="section-head">
        <h2 id="h-${esc(c.id)}">${svg(c.icon, 24)}${esc(c.name)}</h2>
        <span class="count">${list.length} ta taom</span>
      </div>
      <ul class="dishes">
        ${list.map(d => {
          const imgs = dishImages(d, 600);
          return `<li><button type="button" class="dish glass" data-dish="${esc(d.id)}" aria-label="${esc(d.name)}, ${esc(fmtPrice(d.price, cur))}">
            <span class="photo">${imgs.length ? `<img src="${esc(imgs[0])}" alt="" loading="lazy" decoding="async">` : svg(c.icon, 40)}
              ${imgs.length > 1 ? `<span class="many">${svg('image', 12)}${imgs.length}</span>` : ''}</span>
            <span class="dish-name">${esc(d.name)}</span>
            <span class="dish-price">${esc(fmtPrice(d.price, cur))}</span>
          </button></li>`;
        }).join('')}
      </ul>
    </section>`).join('');
  onScroll();
}

/* ---------- category navigation ---------- */
function stickyBottom() {
  const tb = $('#toolbar');
  return parseFloat(getComputedStyle(tb).top) + tb.offsetHeight;
}
let navLock = false, navTimer = 0;
function onCatClick(e) {
  const a = e.target.closest('.cat-link');
  if (!a) return;
  e.preventDefault();
  const sec = document.getElementById('cat-' + a.dataset.cat);
  if (!sec) return;
  setActive(a.dataset.cat);
  navLock = true;
  clearTimeout(navTimer);
  const release = () => { navLock = false; window.removeEventListener('scrollend', release); onScroll(); };
  window.addEventListener('scrollend', release, { once: true });
  navTimer = setTimeout(release, 1200);
  const y = sec.getBoundingClientRect().top + scrollY - stickyBottom() - 8;
  window.scrollTo({ top: Math.max(0, y), behavior: scrollBehavior() });
  history.replaceState(null, '', '#cat-' + a.dataset.cat);
}
let ticking = false;
function onScroll() {
  if (ticking || navLock) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const secs = $$('.section');
    if (!secs.length) return;
    const line = stickyBottom() + 24;
    let cur = secs[0];
    for (const s of secs) { if (s.getBoundingClientRect().top <= line) cur = s; else break; }
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1];
    setActive(cur.dataset.cat);
  });
}
function setActive(id) {
  const strip = $('#catNav');
  $$('.cat-link', strip).forEach(a => {
    const on = a.dataset.cat === id;
    if ((a.getAttribute('aria-current') === 'true') === on) return;
    a.setAttribute('aria-current', on ? 'true' : 'false');
    /* instant: a second smooth scroll would cancel the page's own smooth scroll in Chrome */
    if (on) strip.scrollLeft = a.offsetLeft - (strip.clientWidth - a.offsetWidth) / 2;
  });
}

/* ---------- dish detail with carousel ---------- */
function openDish(id) {
  const d = MENU.dishes.find(x => x.id === id);
  if (!d) return;
  const imgs = dishImages(d, 1000);
  const ings = ingList(d.ing);
  const many = imgs.length > 1;
  openSheet(`
    <div class="sheet-head">
      <h2>${esc(d.name)}</h2>
      <button class="icon-btn" type="button" data-close aria-label="Yopish">${svg('x', 20)}</button>
    </div>
    ${imgs.length ? `
    <div class="carousel" role="region" aria-roledescription="karusel" aria-label="${esc(d.name)} rasmlari">
      ${many ? `<span class="counter" id="counter" aria-hidden="true">1 / ${imgs.length}</span>` : ''}
      <div class="track" id="track" ${many ? 'tabindex="0" aria-label="Rasmlar: chap va o\'ng tugmalar bilan almashtiring"' : ''}>
        ${imgs.map((src, i) => `<figure class="slide" role="group" aria-roledescription="slayd" aria-label="${i + 1}-rasm, jami ${imgs.length}">
          <img src="${esc(src)}" alt="${esc(d.name)}, ${i + 1}-rasm" ${i ? 'loading="lazy"' : ''}></figure>`).join('')}
      </div>
      ${many ? `
      <button class="icon-btn nav-btn prev" type="button" id="prev" aria-label="Oldingi rasm" disabled>${svg('chevronLeft', 20)}</button>
      <button class="icon-btn nav-btn next" type="button" id="next" aria-label="Keyingi rasm">${svg('chevronRight', 20)}</button>
      <div class="dots">${imgs.map((_, i) => `<button class="dot" type="button" data-go="${i}" aria-label="${i + 1}-rasm" aria-current="${i === 0}"></button>`).join('')}</div>` : ''}
    </div>` : ''}
    <div class="detail-price"><span class="label">Narxi</span><strong>${esc(fmtPrice(d.price, MENU.settings.currency))}</strong></div>
    ${d.desc ? `<p class="detail-desc">${esc(d.desc)}</p>` : ''}
    ${ings.length ? `<h3 class="ing-title">Tarkibi</h3><ul class="ing">${ings.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
  `);
  if (many) initCarousel(imgs.length);
}

function initCarousel(n) {
  const track = $('#track');
  let idx = 0;
  const go = i => {
    idx = Math.max(0, Math.min(n - 1, i));
    track.scrollTo({ left: idx * track.clientWidth, behavior: scrollBehavior() });
  };
  const sync = () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    idx = i;
    $('#counter').textContent = `${i + 1} / ${n}`;
    $$('.dot').forEach((dEl, k) => dEl.setAttribute('aria-current', k === i ? 'true' : 'false'));
    $('#prev').disabled = i === 0;
    $('#next').disabled = i === n - 1;
  };
  track.addEventListener('scroll', sync, { passive: true });
  $('#prev').addEventListener('click', () => go(idx - 1));
  $('#next').addEventListener('click', () => go(idx + 1));
  $('.dots').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
  track.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
  });
}

boot();
</script>
</body>
</html>
